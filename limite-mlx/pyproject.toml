[project]
name = "limite-mlx"
version = "0.1.0"
description = "Limite inference on Apple Silicon with MLX"
readme = "README.md"
license = "Apache-2.0"
requires-python = "~=3.12.0"
dependencies = [
    "mlx>=0.31",
    "mlx-lm>=0.31",
    "huggingface-hub>=1.0",
]

[project.scripts]
limite-generate = "limite_mlx.generate:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12", "torch>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limite_mlx"]

[tool.uv]
default-groups = []
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
